name: Hourly Directory Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-directory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hourly directory maintenance
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.OTS_PLATFORM_URL }}/api/sync-directory" \
            -H "x-sync-token: ${{ secrets.OTS_SYNC_TOKEN }}" \
            -H "content-type: application/json" \
            --data '{"pageLimit":4,"includeDetails":true,"detailLimit":100,"officialResearchLimit":25,"enrichLimit":100,"monitorLimit":100}'
