name: Hourly Directory Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-directory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIRECT_CONNECTION_STRING: ${{ secrets.DIRECT_CONNECTION_STRING }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.PROJECT_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_SUPABASE_SERVICE_ROLE_KEY || secrets.SECRET_KEY }}
      SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
      OTSERVLIST_FETCH_MODE: scrapingbee
      OTSERVLIST_PAGE_LIMIT: '20'
      OTSERVLIST_INCLUDE_DETAILS: 'false'
      OTSERVLIST_DETAIL_LIMIT: '0'
      OTSERVLIST_OFFICIAL_RESEARCH_LIMIT: '0'
      OTSERVLIST_TIMEOUT_MS: '120000'
      OTSERVLIST_PAGE_DELAY_MS: '250'
      SUPABASE_UPSERT_CHUNK_SIZE: '100'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply sync database migrations
        shell: bash
        run: |
          if [ -z "$DIRECT_CONNECTION_STRING" ]; then
            echo "::warning::DIRECT_CONNECTION_STRING is not configured; skipping database migrations."
            exit 0
          fi

          node scripts/apply-supabase-migrations.mjs \
            supabase/migrations/002_add_external_source_fields.sql \
            supabase/migrations/004_top_server_seo.sql \
            supabase/migrations/add_sync_logs.sql

      - name: Run otservlist sync
        run: node scripts/run-otservlist-sync.mjs
